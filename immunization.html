<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juntendo University — Immunization Requirements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: rgba(0,0,0,0.10);
    --border-md: rgba(0,0,0,0.18);
    --text-primary: #1a1917;
    --text-secondary: #6b6a65;
    --text-tertiary: #a09f9a;
    --radius-md: 8px;
    --radius-lg: 14px;
    --red-bg: #FDECEA;
    --red-text: #A32D2D;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1917;
      --surface: #242320;
      --surface2: #2e2d2a;
      --border: rgba(255,255,255,0.09);
      --border-md: rgba(255,255,255,0.16);
      --text-primary: #f0ede8;
      --text-secondary: #9e9b95;
      --text-tertiary: #65635e;
      --red-bg: #3a1616;
      --red-text: #F09595;
    }
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 0 0 3rem;
  }

  .mock-banner {
    background: #1a1917;
    color: #FAC775;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-align: center;
    padding: 6px;
  }

  .portal-wrap { max-width: 480px; margin: 0 auto; padding: 1.25rem 1rem 0; }

  .portal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1rem;
  }

  .portal-logo { font-size: 12px; color: var(--text-secondary); font-weight: 500; line-height: 1.6; }

  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

  .lang-toggle { display: flex; gap: 4px; }

  .lang-btn {
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    padding: 4px 11px;
    border: 0.5px solid var(--border-md);
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.15s;
  }

  .lang-btn.active { background: var(--surface2); color: var(--text-primary); }

  .logout-btn {
    font-size: 11px;
    font-family: 'DM Sans', sans-serif;
    padding: 3px 9px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--text-tertiary);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .logout-btn:hover { color: var(--text-secondary); border-color: var(--border-md); }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--text-secondary);
    text-decoration: none;
    margin-bottom: 1rem;
  }

  .back-link:hover { color: var(--text-primary); }

  .page-title { font-size: 18px; font-weight: 500; margin-bottom: 4px; }
  .page-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 1.25rem; line-height: 1.5; }

  .field-card {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius-lg); padding: 1.1rem;
    margin-bottom: 1rem;
  }

  .field-title {
    font-size: 14px; font-weight: 500; margin-bottom: 10px;
    display: flex; align-items: center; gap: 7px;
  }

  .field-title i { color: var(--red-text); font-size: 17px; }

  .body-text {
    font-size: 13px; color: var(--text-primary); line-height: 1.7;
    margin-bottom: 12px; white-space: pre-line;
  }

  .body-text a { color: var(--red-text); text-decoration: none; }
  .body-text a:hover { text-decoration: underline; }

  .link-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 12px; border: 0.5px solid var(--border-md);
    border-radius: var(--radius-md); background: var(--surface2);
    color: var(--text-primary); text-decoration: none;
    font-size: 14px; margin-bottom: 8px;
  }

  .link-btn:last-child { margin-bottom: 0; }
  .link-btn:hover { background: var(--surface); border-color: var(--red-text); }
  .link-btn .link-icon { font-size: 18px; color: var(--red-text); flex-shrink: 0; }
  .link-btn .link-label { flex: 1; }
  .link-btn .link-arrow { color: var(--text-tertiary); font-size: 15px; flex-shrink: 0; }

  .footer-note { font-size: 11px; color: var(--text-tertiary); text-align: center; margin-top: 2rem; }
</style>
</head>
<body>

<div class="mock-banner">BETA</div>

<div class="portal-wrap">

  <div class="portal-header">
    <div class="portal-logo">Juntendo University<br>International Student/Researcher Portal</div>
    <div class="header-right">
      <div class="lang-toggle">
        <button class="lang-btn active" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('ja')">日本語</button>
      </div>
      <button class="logout-btn" onclick="doLogout()">
        <i class="ti ti-logout" aria-hidden="true" style="font-size:13px"></i>
        <span id="logout-label">Sign out</span>
      </button>
    </div>
  </div>

  <a class="back-link" href="index.html">
    <i class="ti ti-arrow-left" aria-hidden="true"></i>
    <span id="back-label">Back to portal</span>
  </a>

  <p class="page-title" id="page-title">Immunization Requirements</p>
  <p class="page-sub" id="page-sub">Required for access to Juntendo Hospital.</p>

  <div class="field-card">
    <p class="field-title"><i class="ti ti-vaccine" aria-hidden="true"></i><span id="title-notice">Immunization Requirements</span></p>
    <p class="body-text" id="notice-text"></p>
  </div>

  <div class="field-card">
    <p class="field-title"><i class="ti ti-link" aria-hidden="true"></i><span id="title-links">Resources</span></p>
    <a class="link-btn" href="https://en.juntendo.ac.jp/academics/clinical-observership/immunization-requirements.html" target="_blank" rel="noopener">
      <i class="ti ti-vaccine link-icon" aria-hidden="true"></i>
      <span class="link-label" id="label-requirements-link">Immunization Requirements</span>
      <i class="ti ti-external-link link-arrow" aria-hidden="true"></i>
    </a>
    <a class="link-btn" href="./pdf/Immunization_Requirements_20260527.pdf" target="_blank" rel="noopener">
      <i class="ti ti-file-download link-icon" aria-hidden="true"></i>
      <span class="link-label" id="label-form-link">Immunization Requirement Form (PDF)</span>
      <i class="ti ti-download link-arrow" aria-hidden="true"></i>
    </a>
  </div>

  <p class="footer-note">Juntendo University International Center (JUIC)</p>

</div>

<script>
/* ── session check (approved + visible section only) ── */
var session = null;
(function() {
  var raw = localStorage.getItem('juic_session');
  if (!raw) { window.location.href = 'login.html'; return; }
  try {
    var s = JSON.parse(raw);
    if (!s.expires || Date.now() > s.expires) {
      localStorage.removeItem('juic_session');
      window.location.href = 'login.html';
      return;
    }
    if (s.portal_status !== '承認' || s.show_immunization === false) {
      window.location.href = 'index.html';
      return;
    }
    session = s;
  } catch(e) {
    localStorage.removeItem('juic_session');
    window.location.href = 'login.html';
  }
})();

function doLogout() {
  localStorage.removeItem('juic_session');
  window.location.href = 'login.html';
}

/* ── i18n ── */
var T = {
  en: {
    logout: 'Sign out', back: 'Back to portal',
    pageTitle: 'Immunization Requirements',
    pageSub: 'Required for access to Juntendo Hospital.',
    titleNotice: 'Immunization Requirements',
    noticeHtml: "If you plan to enter Juntendo University Hospital\nduring your research period, you must fulfill all\nImmunization Requirements in advance.\nPlease submit the completed form to:\n<a href=\"mailto:juic@juntendo.ac.jp\">juic@juntendo.ac.jp</a>",
    titleLinks: 'Resources',
    labelRequirementsLink: 'Immunization Requirements',
    labelFormLink: 'Immunization Requirement Form (PDF)'
  },
  ja: {
    logout: 'ログアウト', back: 'ポータルへ戻る',
    pageTitle: 'Immunization Requirements',
    pageSub: '順天堂医院への立ち入りに必要な予防接種要件',
    titleNotice: '予防接種要件について',
    noticeHtml: "研究期間中に順天堂医院内へ立ち入る場合は、\n事前にすべての予防接種要件を満たす必要があります。\n記入済みのフォームを以下のメールアドレスへ\nお送りください：<a href=\"mailto:juic@juntendo.ac.jp\">juic@juntendo.ac.jp</a>",
    titleLinks: '関連リンク',
    labelRequirementsLink: 'Immunization Requirements（詳細）',
    labelFormLink: 'Immunization Requirement Form（PDF）'
  }
};

function applyLang(lang) {
  var t = T[lang];
  document.getElementById('logout-label').textContent = t.logout;
  document.getElementById('back-label').textContent   = t.back;
  document.getElementById('page-title').textContent   = t.pageTitle;
  document.getElementById('page-sub').textContent     = t.pageSub;
  document.getElementById('title-notice').textContent = t.titleNotice;
  document.getElementById('notice-text').innerHTML    = t.noticeHtml;
  document.getElementById('title-links').textContent  = t.titleLinks;
  document.getElementById('label-requirements-link').textContent = t.labelRequirementsLink;
  document.getElementById('label-form-link').textContent = t.labelFormLink;
}

function setLang(lang) {
  document.querySelectorAll('.lang-btn').forEach(function(b,i){
    b.classList.toggle('active', lang === 'ja' ? i===1 : i===0);
  });
  applyLang(lang);
}

applyLang('en');
</script>
</body>
</html>
